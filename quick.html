<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fab Hub Quick Launch</title>
<meta name="description" content="Quick launcher for your web apps. Open any app instantly.">
<meta name="theme-color" content="#0b1020" id="theme-color-meta">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/style.css">
<link rel="canonical" href="https://fabhub.app/quick">
<meta property="og:title" content="Fab Hub Quick Launch">
<meta property="og:description" content="Quick launcher for your web apps. Open any app instantly.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://fabhub.app/quick">
<meta property="og:image" content="https://fabhub.app/icons/icon-512.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Fab Hub Quick Launch">
<meta name="twitter:description" content="Quick launcher for your web apps. Open any app instantly.">
<script>
(function(){
  var theme=localStorage.getItem('fabhub-theme')||'system';
  var root=document.documentElement;
  if(theme==='system'){
    theme=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
  }
  root.setAttribute('data-theme',theme);
  var meta=document.getElementById('theme-color-meta');
  if(meta){meta.content=theme==='dark'?'#0b1020':'#f4f6fb'}
})();
</script>
</head>
<body>
<main class="quick-launcher">
  <header class="quick-header">
    <svg width="48" height="48" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="margin-bottom:16px;color:var(--acc)"><rect width="32" height="32" rx="8" fill="url(#grad)"/><path d="M8 16L14 22L24 10" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><defs><linearGradient id="grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#f97316"/></linearGradient></defs></svg>
    <h1>Quick Launch</h1>
    <p>Tap any app to open it instantly</p>
  </header>
  <div id="quickGrid" class="quick-grid" role="list" aria-label="Quick launch apps"></div>
  <div id="quickEmpty" class="empty" hidden>No apps yet. Open <a href="/app" style="color:var(--acc)">Fab Hub</a> to add apps.</div>
</main>

<footer class="landing-footer" role="contentinfo" style="margin-top:48px;padding:32px 20px">
  <div class="footer-inner" style="max-width:800px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px">
    <p style="color:var(--mut);font-size:13px;margin:0">© 2026 Fab Hub. Built by FABIAN CODES HQ</p>
    <a href="/app" class="landing-cta" style="padding:10px 20px;font-size:14px">Open Full App</a>
  </div>
</footer>

<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const LS='fabhub.apps',enc=encodeURIComponent;
function sanitize(arr){return (arr||[]).filter(x=>x&&x.url)}
function gen(a){return `/api/icon?n=${enc(a.name)}&c=${enc(a.color||'#0f172a')}`}
function getDomain(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch{return ''}}
function getFaviconUrl(u){const d=getDomain(u);return d?`/api/icon?domain=${encodeURIComponent(d)}`:''}
function resolveIcon(a){if(a.icon)return a.icon;return getFaviconUrl(a.url)||gen(a)}
function esc(s){return String(s??'').replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"').replace(/'/g,'')}

function renderQuick(){
  const mine=sanitize(JSON.parse(localStorage.getItem(LS)||'[]'));
  const grid=$('#quickGrid');
  const empty=$('#quickEmpty');
  if(!mine.length){
    grid.hidden=true;
    empty.hidden=false;
    return;
  }
  empty.hidden=true;
  grid.hidden=false;
  grid.innerHTML=mine.map(a=>{
    const src=resolveIcon(a);
    const isFallback=src.startsWith('/api/icon?n=');
    return `<a href="${esc(a.url)}" target="_blank" rel="noopener" class="quick-item" role="listitem" aria-label="Open ${esc(a.name)}">
      <div class="quick-icon ${isFallback?'fallback':''}">
        ${isFallback?'<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="4"/></svg>':`<img src="${esc(src)}" alt="" loading="lazy" onerror="this.onerror=null;this.src='${esc(gen(a))}';this.parentElement.classList.add('fallback');this.outerHTML='<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"white\" stroke-width=\"2.5\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"4\"/></svg>'">`}
      </div>
      <span>${esc(a.name)}</span>
    </a>`;
  }).join('');
}

document.addEventListener('DOMContentLoaded',renderQuick);
</script>
</body>
</html>
